name: Ingest jobs

on:
  schedule:
    # Every 6 hours, in UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Country tab to refresh"
        type: choice
        default: canada
        options:
          - canada
          - usa
          - north-america

# One ingestion at a time. A second run waits instead of overlapping.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run ingestion
        run: |
          python -m scripts.ciIngest \
            --market "${{ inputs.market || 'canada' }}" \
            --trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"
